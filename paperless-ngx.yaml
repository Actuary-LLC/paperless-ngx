version: "3.9"

networks:
  reverse-proxy:
    external: true

services:
  ngx:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.4.2
    # Run as Unraid nobody:users (99:100) directly. The image ships 1000:1000;
    # USERMAP_UID remapping runs `usermod` at startup which re-owns the entire
    # /usr/src/paperless home tree (app + venv + bind mounts) via overlay
    # copy-ups and NFS walks - it never completed, so no service ever started.
    # As non-root, the entrypoint skips the UID/GID remap entirely.
    user: "99:100"
    # No published ports (hardening): access via traefik (paperless.lan /
    # https://paperless.actuary.dev) and from other containers over the overlay
    # network (http://paperless_ngx:8000).
    ports: []
    # The image's built-in HEALTHCHECK (curl http://localhost:8000, interval 30s,
    # 5 retries, NO start_period) marks slow starts as unhealthy and Swarm
    # SIGKILLs the task (exit 137), causing a silent ~3-minute restart loop.
    # Disabled until webserver startup is verified stable.
    healthcheck:
      disable: true
    volumes:
      - /mnt/user/docker/volumes/paperless:/usr/src/paperless/data
      - /mnt/user/vault/documents:/usr/src/paperless/media
      - /mnt/user/vault/exports:/usr/src/paperless/export
      - /mnt/user/scan:/usr/src/paperless/consume
    environment:
      PAPERLESS_CONSUMER_POLLING: 60
      PAPERLESS_ADMIN_USER: ${PAPERLESS_ADMIN_USER}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD}
      PAPERLESS_URL: https://paperless.actuary.dev
      ## Cache
      PAPERLESS_REDIS: redis://192.168.2.2:6379
      PAPERLESS_REDIS_PREFIX: paperless
      ## Database
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: 192.168.2.2 
      PAPERLESS_DBPORT: ${POSTGRES_PORT}
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: ${POSTGRES_USER}
      PAPERLESS_DBPASS: ${POSTGRES_PASSWORD}
    networks:
      - reverse-proxy
    deploy:
      labels:
        ## Proxy
        - traefik.enable=true
        - traefik.http.routers.paperless.rule=Host(`paperless.actuary.dev`)
        - traefik.http.routers.paperless.entrypoints=websecure
        - traefik.http.routers.paperless.service=paperless
        - traefik.http.routers.paperless.tls=true
        - traefik.http.routers.paperless.tls.certresolver=myresolver
        - traefik.http.services.paperless.loadbalancer.server.port=8000
        - traefik.http.routers.paperless.middlewares=lan-only@file,authentik@file
        ## Homepage
          #Service
        - homepage.group=Productivity
        - homepage.name=Paperless
        - homepage.description=Document management
        - homepage.icon=https://avatars.githubusercontent.com/u/99562962?s=200&v=4
        - homepage.server=my-docker
        - homepage.container=paperless_ngx
        - homepage.href=https://paperless.actuary.dev
          #Widget
        - homepage.widget.type=paperlessngx
        - homepage.widget.url=http://paperless_ngx:8000
        - homepage.widget.username=${PAPERLESS_ADMIN_USER}
        - homepage.widget.password=${PAPERLESS_ADMIN_PASSWORD}
        ## DIUN
        - diun.enable=true
